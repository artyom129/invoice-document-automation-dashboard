<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}InvoiceFlow{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23171717'/%3E%3Cpath d='M9 6h10l5 5v15H9z' fill='none' stroke='%23ededed' stroke-width='2.2' stroke-linejoin='round'/%3E%3Cpath d='M13 17h7M13 21h7' stroke='%23ededed' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M9.5 12.5h5M9.5 16h5"/></svg>
      <strong>InvoiceFlow</strong>
    </a>
    <nav>
      <a href="/" class="{{ 'active' if request.url.path == '/' }}">Invoices</a>
      <a href="/upload" class="{{ 'active' if request.url.path == '/upload' }}">Upload</a>
      <a href="/docs" target="_blank" rel="noopener">API</a>
    </nav>
    <a class="button small" href="/upload">Upload invoices</a>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', path='app.js') }}"></script>
</body>
</html>
